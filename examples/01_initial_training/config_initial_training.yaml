# OPTICUS - Initial Training Configuration
# 처음부터 새로운 모델을 학습하는 설정

# Random seed for reproducibility
seed: 14000

# Data paths
data:
  train_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/train_dataset.h5'
  val_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/val_dataset.h5'
  test_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/test_dataset.h5'

# DataLoader settings
dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Model architecture
model:
  name: 'ViT50_3block'
  img_size: 500
  patch_size: 50
  embed_dim: 256
  depth: 3
  num_heads: 8
  mlp_dim: 1024
  num_classes: 1

# Optimizer settings
optimizer:
  type: 'AdamW'
  lr: 1.0e-4              # Initial learning rate
  weight_decay: 0.01

# Scheduler settings
scheduler:
  type: 'ReduceLROnPlateau'
  mode: 'min'
  factor: 0.7             # LR reduction factor
  patience: 2             # Epochs to wait before reducing LR
  threshold: 0.0
  threshold_mode: 'abs'
  verbose: true

# Training settings
training:
  num_epochs: 300
  patience: 11            # Early stopping patience
  save_path: './examples/01_initial_training/checkpoints/best_model.pth'

# Evaluation and visualization
evaluation:
  save_results_plot: './examples/01_initial_training/results/evaluation_results.png'
  save_history_plot: './examples/01_initial_training/results/training_history.png'

# Device
device: 'cuda'

