# OPTICUS - Resume Training Configuration
# 기존 체크포인트에서 학습을 이어가는 설정

# Random seed for reproducibility
seed: 14000

# Data paths
data:
  train_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/train_dataset.h5'
  val_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/val_dataset.h5'
  test_path: '/home/work/CamSim/Hole_Output/s2_best_initialtraining/test_dataset.h5'

# DataLoader settings
dataloader:
  batch_size: 32
  num_workers: 4
  pin_memory: true

# Model architecture (must match the checkpoint)
model:
  name: 'ViT50_3block'
  img_size: 500
  patch_size: 50
  embed_dim: 256
  depth: 3
  num_heads: 8
  mlp_dim: 1024
  num_classes: 1

# Checkpoint to resume from
checkpoint:
  load_path: '../01_initial_training/checkpoints/best_model.pth'
  # Or use absolute path:
  # load_path: '/home/work/CamSim/OPTICUS/best_vit50_3block.pth'

# Optimizer settings (fine-tuning with lower learning rate)
optimizer:
  type: 'AdamW'
  lr: 1.0e-5              # Lower LR for fine-tuning
  weight_decay: 0.01

# Scheduler settings
scheduler:
  type: 'ReduceLROnPlateau'
  mode: 'min'
  factor: 0.5             # More aggressive LR reduction
  patience: 2
  threshold: 0.0
  threshold_mode: 'abs'
  verbose: true

# Training settings
training:
  num_epochs: 150         # Additional epochs
  patience: 10            # Early stopping patience
  save_path: './examples/02_resume_training/checkpoints/resumed_model.pth'

# Evaluation and visualization
evaluation:
  save_results_plot: './examples/02_resume_training/results/evaluation_results.png'
  save_history_plot: './examples/02_resume_training/results/training_history.png'

# Device
device: 'cuda'

